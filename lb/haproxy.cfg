global
    log stdout format raw local0
    maxconn 10000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 1s

frontend public_http
    bind *:80
    default_backend api_pool

backend api_pool
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 1s fall 2 rise 2
    server-template api 10 lb-api:8000 check resolvers docker init-addr libc,none

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
